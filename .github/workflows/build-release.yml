name: Build portable apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      editions:
        description: "Which editions to build"
        type: choice
        default: standard
        options: [standard, ai, both]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  # timesfm and chronos-forecasting both require >= 3.10.
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  # Decides which editions to build. Tags build both; a manual run builds
  # whatever was chosen; a PR builds only Standard to keep CI fast.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      wants_ai: ${{ steps.pick.outputs.wants_ai }}
    steps:
      - id: pick
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            push)              CHOICE=both ;;                                  # tag
            workflow_dispatch) CHOICE="${{ github.event.inputs.editions }}" ;;
            *)                 CHOICE=standard ;;                              # pull_request
          esac

          case "$CHOICE" in
            standard) EDITIONS='["standard"]';        AI=false ;;
            ai)       EDITIONS='["ai"]';              AI=true  ;;
            both)     EDITIONS='["standard","ai"]';   AI=true  ;;
          esac

          echo "Building editions: $EDITIONS"
          echo "matrix={\"os\":[\"windows-latest\",\"macos-latest\"],\"edition\":$EDITIONS}" >> "$GITHUB_OUTPUT"
          echo "wants_ai=$AI" >> "$GITHUB_OUTPUT"

  # Proves the TimesFM/Chronos wrappers actually work before we ship a build
  # around them. These code paths had never been executed: the packages were
  # absent and a blanket except-clause hid that while reporting the fallback
  # under a vendor name.
  ai-smoke:
    needs: plan
    if: needs.plan.outputs.wants_ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install AI dependencies (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt -r requirements-ai.txt

      - name: Report resolved versions
        run: pip list | grep -Ei "torch|timesfm|chronos|transformers|huggingface" || true

      - name: Check the vendor APIs we call still exist
        run: python -m pytest tests/test_ai_models.py -v -rs

      - name: Run a real forecast through both foundation models
        env:
          FB_AI_WEIGHTS: "1"
        run: python -m pytest tests/test_ai_models.py -v -rs

  build:
    needs: [test, plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          if [ "${{ matrix.edition }}" = "ai" ]; then
            # CPU wheels only — a CUDA build would add gigabytes for a desktop
            # app that always runs on the CPU.
            pip install --index-url https://download.pytorch.org/whl/cpu torch
            pip install -r requirements.txt -r requirements-ai.txt
          else
            pip install -r requirements.txt
          fi
          pip install pyinstaller

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Derive version and names
        shell: bash
        run: |
          REF="${GITHUB_REF#refs/tags/v}"
          if [ "$REF" = "$GITHUB_REF" ]; then REF="0.0.0-dev"; fi
          echo "FB_VERSION=$REF" >> "$GITHUB_ENV"
          if [ "${{ matrix.edition }}" = "ai" ]; then
            echo "SUFFIX=-ai" >> "$GITHUB_ENV"
          else
            echo "SUFFIX=" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          FB_EDITION: ${{ matrix.edition }}
        run: pyinstaller packaging/forecasting_bench.spec --noconfirm

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cp README.md dist/ForecastingBench/README.txt
          cd dist
          7z a -tzip "../ForecastingBench-${FB_VERSION}${SUFFIX}-windows-portable.zip" ForecastingBench

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd dist
          # ditto, not zip: it preserves the symlinks inside the .app bundle.
          # A plain zip corrupts the Python framework and the app won't launch.
          ditto -c -k --keepParent --sequesterRsrc \
            "Time Series Forecasting Bench.app" \
            "../ForecastingBench-${FB_VERSION}${SUFFIX}-macos.zip"

      - name: Report size
        shell: bash
        run: ls -lh ForecastingBench-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ForecastingBench-${{ matrix.edition }}-${{ matrix.os }}
          path: ForecastingBench-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          body: |
            ## Time Series Forecasting Bench

            Built by [Kevin Xing](https://www.linkedin.com/in/xiaoang-kevin-xing-0a490359/)
            — pharmacy operations & business optimization consulting.

            ### Which one do I want?

            **Standard** — start here. Seven forecasting methods, opens in
            seconds, works with no internet at all.

            | Platform | File | What to do |
            |---|---|---|
            | Windows | `...windows-portable.zip` | Unzip anywhere, double-click `ForecastingBench.exe` |
            | macOS | `...macos.zip` | Unzip, drag to Applications. **First launch:** right-click → *Open* |

            **AI Edition** (`...-ai-...`) — adds Google TimesFM 2.5 and Amazon
            Chronos-2. Much larger, and it downloads about 1.3 GB of model
            weights the first time you enable them. Worth it mainly for long or
            unusual histories; for monthly pharmacy revenue, ARIMA and ETS are
            usually competitive.

            No installer either way. Nothing is written to Program Files or the
            registry, and your data never leaves your computer.
