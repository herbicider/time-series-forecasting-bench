name: Build Windows app

# One artifact, one download, one filename. The target user is a pharmacy
# owner, not a developer: every extra choice on the Releases page is a chance
# to pick the wrong file or give up. So we publish exactly one asset, named
# without a version, which keeps this permalink valid forever:
#
#   https://github.com/herbicider/time-series-forecasting-bench/releases/latest/download/TimeSeriesForecastingBench-Windows.zip
#
# It is the AI edition, which is a superset: it runs the seven built-in
# methods out of the box and can additionally download the TimesFM/Chronos
# weights from inside the app.

on:
  push:
    tags: ["v*"]
    # TEMPORARY: verifying the Windows launch fix on the runner.
    branches: ["claude/**"]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

# A superseded branch build is wasted runner time, and a hung one would
# otherwise sit there until the 90-minute job timeout. Tag builds are never
# cancelled: those are the ones that publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # timesfm and chronos-forecasting both require >= 3.10.
  PYTHON_VERSION: "3.11"
  ASSET_NAME: TimeSeriesForecastingBench-Windows.zip

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  # Runs TimesFM and Chronos against real downloaded weights before anything
  # ships. These code paths are invisible to the build step — packaging never
  # executes a model — so without this an upstream API change would be
  # published as a working release.
  ai-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install AI dependencies (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt -r requirements-ai.txt

      - name: Check the vendor APIs we call still exist
        run: python -m pytest tests/test_ai_models.py -v -rs

      - name: Run a real forecast through both foundation models
        env:
          FB_AI_WEIGHTS: "1"
        run: python -m pytest tests/test_ai_models.py -v -rs

  build:
    needs: [test, ai-smoke]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          # CPU wheels only: a CUDA build would add gigabytes to a desktop app
          # that always runs on the CPU.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt -r requirements-ai.txt
          pip install pyinstaller

      - name: Run tests
        timeout-minutes: 20
        run: python -m pytest tests/ -q

      - name: Derive version
        shell: bash
        run: |
          REF="${GITHUB_REF#refs/tags/v}"
          if [ "$REF" = "$GITHUB_REF" ]; then REF="0.0.0-dev"; fi
          echo "FB_VERSION=$REF" >> "$GITHUB_ENV"

      - name: Build
        env:
          FB_EDITION: ai
        run: pyinstaller packaging/forecasting_bench.spec --noconfirm

      # Nothing above this point ever runs the app. Packaging cannot fail on a
      # missing GUI backend or a service that will not boot, which is how a
      # build that started and vanished after a few seconds got published as a
      # working release. This step launches the executable that ships.
      - name: Smoke-test the packaged app
        timeout-minutes: 15
        shell: pwsh
        env:
          FB_LOG_DIR: ${{ github.workspace }}\smoke-logs
        run: |
          $exe = "dist\ForecastingBench\ForecastingBench.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--self-check" -PassThru
          if (-not $proc.WaitForExit(600000)) {
            $proc.Kill()
            throw "The packaged app hung and never finished its self-check."
          }
          Get-Content "$env:FB_LOG_DIR\selfcheck.log" -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) {
            throw "The packaged app failed its self-check (exit code $($proc.ExitCode))."
          }

      # Opening a real WebView2 window depends on the runner having a usable
      # desktop session, which is not something this workflow controls. It is
      # reported but not enforced, so a runner-side limitation cannot block a
      # release — while a genuine window failure still shows up in the log.
      - name: Open a real window (reported, not enforced)
        timeout-minutes: 15
        shell: pwsh
        continue-on-error: true
        env:
          FB_LOG_DIR: ${{ github.workspace }}\smoke-logs-window
        run: |
          $exe = "dist\ForecastingBench\ForecastingBench.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--self-check","--window" -PassThru
          if (-not $proc.WaitForExit(600000)) {
            $proc.Kill()
            throw "The packaged app hung while opening its window."
          }
          Get-Content "$env:FB_LOG_DIR\selfcheck.log" -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) {
            throw "The window self-check failed (exit code $($proc.ExitCode))."
          }

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: |
            smoke-logs
            smoke-logs-window
          if-no-files-found: warn

      - name: Package
        shell: bash
        run: |
          cp packaging/START-HERE.txt dist/ForecastingBench/START-HERE.txt
          cd dist
          7z a -tzip "../${ASSET_NAME}" ForecastingBench
          cd ..
          ls -lh "${ASSET_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: TimeSeriesForecastingBench-Windows
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_NAME }}
          name: Time Series Forecasting Bench ${{ github.ref_name }}
          body: |
            ## Download

            **[⬇ Download for Windows](https://github.com/herbicider/time-series-forecasting-bench/releases/latest/download/TimeSeriesForecastingBench-Windows.zip)**

            Then:

            1. Open your **Downloads** folder and **right-click** the file →
               **Extract All…** → **Extract**
            2. Open the new folder and double-click **ForecastingBench**
            3. If Windows says *"Windows protected your PC"*, click
               **More info** → **Run anyway**. That appears because the app is
               not code-signed, not because anything was found.

            Nothing is installed. No admin rights. Your data never leaves your
            computer.

            ---

            Built by [Kevin Xing](https://www.linkedin.com/in/xiaoang-kevin-xing-0a490359/)
            — pharmacy operations & business optimization consulting.
